name: 'FTP Deployment'
author: 'Israel Roldan <israel.alberto.rv@gmail.com>'
description: >-
  Copy all the files and folders via FTP from your Git project to your server in a specific path,
  delete remote folder before.
inputs:
  server:
    description: 'FTP Server.'
    required: true
  user:
    description: 'FTP User.'
    required: true
  password:
    description: 'FTP Password.'
    required: true
  local_dir:
    description: 'Local directory.'
    required: false
    default: './'
  remote_dir:
    description: 'Remote directory.'
    required: false
    default: './'
  delete:
    description: 'Delete all the files inside of the remote directory.'
    required: false
    default: 'false'
  max_retries:
    description: 'Number of times the lftp command will be executed on error. `0` means retry forever (the only exits are lftp success or the global 5h timeout). `1` means no retries.'
    required: false
    default: '10'
  no_symlinks:
    description: 'Do not create symbolic links.'
    required: false
    default: 'true'
  mirror_verbose:
    description: 'Mirror verbosity level (0-3). Passed as --verbose=N to lftp mirror.'
    required: false
    default: '1'
  ftp_ssl_allow:
    description: 'FTP - Allow SSL encryption.'
    required: false
    default: 'true'
  ssl_verify_certificate:
    description: 'Verify SSL certificate.'
    required: false
    default: 'true'
  ssl_check_hostname:
    description: 'Check certificate hostname.'
    required: false
    default: 'true'
  ftp_passive_mode:
    description: 'FTP - This can be useful if you are behind a firewall or a dumb masquerading router.'
    required: false
    default: 'true'
  ftp_use_feat:
    description: 'FTP - FEAT: Determining what extended features the FTP server supports.'
    required: false
    default: 'false'
  ftp_nop_interval:
    description: 'FTP - Delay in seconds between NOOP commands when downloading tail of a file.'
    required: false
    default: '2'
  net_max_retries:
    description: 'NET - Maximum number of operation without success. 0 unlimited. 1 no retries.'
    required: false
    default: '1'
  net_persist_retries:
    description: 'NET - Ignore hard errors. When reply 5xx errors or there is too many users.'
    required: false
    default: '5'
  net_timeout:
    description: 'NET - Sets the network protocol timeout.'
    required: false
    default: '15s'
  dns_max_retries:
    description: 'DNS - 0 no limit trying to lookup an address otherwise try only this number of times.'
    required: false
    default: '8'
  dns_fatal_timeout:
    description: 'DNS - Time for DNS queries. Set to "never" to disable.'
    required: false
    default: '10s'
  lftp_settings:
    description: 'Additional raw lftp settings, e.g. "set cache:cache-empty-listings true; set cmd:status-interval 1s;". Appended to the lftp `-e` command; rejected if it contains control characters, backtick, `$`, `!`, or more than 3 `;`-chained directives (see lib.sh::validate_lftp_settings). `exclude` and `exclude_delete` use the lighter `validate_glob_pattern` instead (v2.11.3, #160) since they flow onto the `mirror` command line as a single argv slot, not into the `-e` script body.'
    required: false
    default: ''
  exclude:
    description: 'POSIX ERE pattern (e.g. `.*\.map`, `node_modules/.*`) passed to `mirror -x` (regex exclude). Files matching the pattern are neither uploaded nor deleted. v2.11.2: switched from the previous (silent-no-op) `set mirror:exclude` to `mirror -x`, which is what lftp 4.9.3 actually applies. v2.11.3 (#160): validated by `validate_glob_pattern` (rejects control characters and leading dash; allows `!`, `;`, `$`, backtick — these are valid glob/regex metacharacters). See #131, #167.'
    required: false
    default: ''
  exclude_delete:
    description: 'Shell glob pattern (lftp PatternSet::Glob syntax, e.g. `*.log`, `uploads/**`) passed to `mirror -X` (glob exclude-delete). Independent of `exclude`: same `mirror -X` semantics as `mirror -x` (both apply to upload AND delete). v2.11.2: switched from the previous (silent-no-op) `set mirror:exclude-file` (no such variable in lftp 4.9.3) to `mirror -X`. v2.11.3 (#160): validated by `validate_glob_pattern` (same rules as `exclude`). See #131, #167.'
    required: false
    default: ''
  debug:
    description: 'If "true", print resolved input values to the log. Default is "false" (only show which inputs were received, not their values).'
    required: false
    default: 'false'
  fail_on_deprecated:
    description: 'If "true", exit 1 when the ref used to invoke this action is end-of-life (v1.0-alpha.*, v1.1, v1.2.0, v1.3.*). Useful for orgs with a "no EOL versions" policy. The deprecation warning is still printed either way; this input only controls whether the action fails.'
    required: false
    default: 'false'
  dry_run:
    description: 'If "true", perform a dry run: lftp will compute the mirror plan but not transfer or delete any file. Useful to preview what the action would change before a destructive run. The action still exits 0 on success (i.e. on a clean dry-run plan) and 1 on a hard error.'
    required: false
    default: 'false'
  upload_log_on_failure:
    description: 'If "true" (default), when the action is about to exit 1, the captured lftp log file is uploaded to the current workflow run as a workflow artifact named "ftp-deployment-action-log-<run-attempt>". Requires the step to expose GITHUB_TOKEN via `env: GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}`. If the token (or any of the other GitHub-Actions env vars) is missing, the upload is silently skipped with a notice and the action still exits 1 normally. If the upload request itself fails (network, 4xx, 5xx), a warning is printed and the action still exits 1. Set to "false" to disable the upload entirely (the log file is still captured under ~/.lftp-logs/ for the runner to inspect).'
    required: false
    default: 'true'
  concurrency_lock:
    description: 'If "true", serialize concurrent deployments to the same FTP server by acquiring a server-side sentinel directory before the mirror. Implementation: lftp issues `quote MKD <path>` before the mirror and `quote RMD <path>` after; while MKD returns 550 (lock held), the action polls up to `concurrency_lock_timeout` seconds. Uses RFC 959 MKD/RMD which every FTP server supports. The lock is released on any exit path (success, error, SIGINT, 5h timeout) by the cleanup trap. Default is "false" (no cross-runner serialization). For zero-config serialization, prefer the GitHub Actions `concurrency:` block in your workflow. Stale-lock auto-recovery (v2.9.0): if the previous holder died before RMD (runner OOM, SIGKILL, 6h job limit), a timestamp-encoded sentinel file is left at the FTP root; the next runner detects it as stale (older than `concurrency_lock_timeout`) and takes over automatically. See README "Concurrency / deployment lock" for details.'
    required: false
    default: 'false'
  concurrency_lock_path:
    description: 'Path of the sentinel directory used by `concurrency_lock`. Relative paths are resolved against the FTP user''s home; absolute paths are accepted. Must be a valid FTP path (no `..`, no shell metacharacters, no leading dash). Default: ".lftp-deployment.lock" (a hidden directory alongside the deployed files). The directory will be created and removed by the action; do not use a path that holds user data.'
    required: false
    default: '.lftp-deployment.lock'
  concurrency_lock_timeout:
    description: 'Maximum seconds to wait for the lock when `concurrency_lock` is "true" and another run is currently holding it. After this, the action exits 1 with a clear error. Set to "0" to fail immediately when the lock is held (no waiting). Default is 300 (5 minutes), which is long enough to ride out a transient concurrent run, short enough that a stale lock surfaces within a normal workflow run.'
    required: false
    default: '300'
  concurrency_lock_poll_interval:
    description: 'Seconds between lock acquisition attempts when `concurrency_lock` is "true". Default is 5, which gives 60 attempts over the default 300-second timeout. Lower values reduce the time-to-acquire after the holder releases; higher values reduce the number of MKD round-trips against the server.'
    required: false
    default: '5'
runs:
  using: 'docker'
  image: 'Dockerfile'
branding:
  color: 'purple'
  icon: 'send'
