name: 'FTP Deployment'
author: 'Israel Roldan <israel.alberto.rv@gmail.com>'
description: >-
  Copy all the files and folders via FTP from your Git project to your server in a specific path,
  optionally deleting remote files that no longer exist locally.
inputs:
  server:
    description: 'FTP server: `ftp://host[:port]` (plain FTP; with `ftp_ssl_allow` "true" it tries explicit TLS but falls back to cleartext if the server or a network attacker refuses it, so use `ftps://` or `lftp_settings` `set ftp:ssl-force true;` to require TLS) or `ftps://host[:port]` (implicit TLS); a bare `host[:port]` means `ftp://`. IPv6 addresses go in brackets: `ftp://[2001:db8::1]:21`. Credentials go in `user` and `password`: a value with `user:pass@`, with or without a scheme, is rejected with exit 2 (a bare `user@` is accepted). Set the target directory with `remote_dir`, not in the URL.'
    required: true
  user:
    description: 'FTP User.'
    required: true
  password:
    description: 'FTP Password.'
    required: true
  local_dir:
    description: 'Local directory to upload. Must not be, contain or lie inside the action''s home directory `/home/lftp`, which holds the FTP credentials (`.netrc`) during the run: `/`, `/home`, `/home/lftp` and any path under it exit 2. Relative values resolve against the job workspace (`/github/workspace`). The check is lexical; symlinks are not followed. A value that contains a backslash, starts with `~` or starts with `file:` also exits 2: the action passes `local_dir` to lftp in double quotes, where `\` is an escape character, and lftp expands a leading `~` to the action''s home and reads `file:` as a local file URL.'
    required: false
    default: './'
  remote_dir:
    description: 'Remote directory. Must be a valid FTP path: it is validated by `validate_path` (lib.sh) and, because it is passed to the lftp mirror command without quotes, must not contain `>`, `\` or `''` (lftp would read them as an output redirection, an escape or a quote and change which directory is used).'
    required: false
    default: './'
  delete:
    description: 'If "true", delete remote files that do not exist in local_dir (files matching `exclude` are kept).'
    required: false
    default: 'false'
  max_retries:
    description: 'Number of times the lftp command will be executed on error. `1` means no retries. `0` retries until lftp succeeds, a permanent error (e.g. a wrong password) is detected, or the job is stopped; set `timeout-minutes` on the job to bound it. Each attempt is limited to 5 hours.'
    required: false
    default: '10'
  no_symlinks:
    description: 'Do not create symbolic links.'
    required: false
    default: 'true'
  mirror_verbose:
    description: 'Mirror verbosity, passed as --verbose=N to lftp mirror: 0 (quiet) to 3 (most verbose); higher values behave like 3.'
    required: false
    default: '1'
  ftp_ssl_allow:
    description: 'FTP - Try explicit TLS (AUTH TLS) on `ftp://`. Opportunistic: lftp falls back to cleartext, password included, if the server or a network attacker refuses it. To require TLS use `ftps://` or `lftp_settings` `set ftp:ssl-force true;`.'
    required: false
    default: 'true'
  ssl_verify_certificate:
    description: 'Verify SSL certificate.'
    required: false
    default: 'true'
  ssl_check_hostname:
    description: 'Check certificate hostname.'
    required: false
    default: 'true'
  tls_max_version:
    description: 'Highest TLS version for FTPS: `1.2` (default) or `1.3`. lftp 4.9.3, the client in this action, resets TLS 1.3 data connections when it closes them: the server replies `426 Failure reading network stream.`, may keep a truncated file, and lftp retries. Set `1.3` only if your server refuses TLS 1.2.'
    required: false
    default: '1.2'
  ftp_passive_mode:
    description: 'FTP - This can be useful if you are behind a firewall or a dumb masquerading router.'
    required: false
    default: 'true'
  ftp_use_feat:
    description: 'FTP - FEAT: Determining what extended features the FTP server supports. With "true", lftp tries explicit TLS on `ftp://` only if the FEAT reply lists AUTH TLS; otherwise it logs in in cleartext without trying.'
    required: false
    default: 'false'
  ftp_nop_interval:
    description: 'FTP - Delay in seconds between NOOP commands when downloading tail of a file.'
    required: false
    default: '2'
  net_max_retries:
    description: 'NET - Maximum number of attempts per lftp operation; 1 means no retries, 0 means unlimited (not recommended).'
    required: false
    default: '1'
  net_persist_retries:
    description: 'NET - Number of times lftp retries hard (5xx) errors such as "530 Login incorrect" before giving up; 0 reports them immediately.'
    required: false
    default: '0'
  net_timeout:
    description: 'NET - Sets the network protocol timeout.'
    required: false
    default: '15s'
  dns_max_retries:
    description: 'DNS - 0 no limit trying to lookup an address otherwise try only this number of times.'
    required: false
    default: '8'
  dns_fatal_timeout:
    description: 'DNS - Time for DNS queries. Set to "never" to disable.'
    required: false
    default: '10s'
  lftp_settings:
    description: 'Additional raw lftp settings, e.g. "set cache:cache-empty-listings true; set cmd:status-interval 1s;". Appended to the lftp `-e` command; rejected if it contains control characters, backtick, `$`, `!`, a newline, or more than 3 `;` characters. The limit counts `;` characters, not directives, so a trailing `;` uses one of the three: "set a 1; set b 2; set c 3;" passes, while four directives written with a trailing `;` are rejected (the same four without it pass). Chaining with `&&` or `||` is not counted. Trusted input: lftp commands can run shell commands in the container and read the FTP credentials, so never pass it values from untrusted sources (reusable-workflow inputs, matrix values or PR data you do not control). The character checks catch mistakes; they are not a security boundary.'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated shell globs (e.g. `*.map, *.bak, node_modules/`). Matching files are neither uploaded nor deleted. Items must not start with `-` or contain spaces, backslashes, single quotes or `>`.'
    required: false
    default: ''
  debug:
    description: 'If "true", print the resolved value of every input to the log. Default is "false": the "Inputs received" dump then prints no values, only "(set)" for an input whose resolved value is non-empty or "(using default)" for an empty one. Action defaults count as set, so the dump cannot tell inputs your workflow passed from inputs left at their default; "(using default)" appears only for inputs that are empty by default, such as lftp_settings and exclude. The password is never printed, even with debug: it shows as "(set, hidden)" or "(empty)" with "true", and as "(set)" with "false".'
    required: false
    default: 'false'
  dry_run:
    description: 'If "true", perform a dry run: lftp will compute the mirror plan but not transfer or delete any file. Useful to preview what the action would change before a destructive run. It still connects and logs in, so an unreachable server or a wrong password fails the dry run. The action exits 0 on success (i.e. on a clean dry-run plan) and 1 on a hard error.'
    required: false
    default: 'false'
  concurrency_lock:
    description: 'If "true", serialize concurrent deployments to the same FTP server by acquiring a server-side sentinel directory before the mirror. Implementation: lftp issues the high-level `mkdir <path>` before the mirror and, after it, deletes this run''s sentinel inside the dir and then sends `quote RMD <path>`; while mkdir fails (the directory exists; a login or connection error looks the same), the action polls up to `concurrency_lock_timeout` seconds. Uses RFC 959 MKD/RMD which every FTP server supports. The lock is released on any exit path (success, error, SIGINT, 5h timeout) by the cleanup trap. Default is "false" (no cross-runner serialization). For zero-config serialization, prefer the GitHub Actions `concurrency:` block in your workflow. Stale-lock auto-recovery: if the previous holder died before RMD (runner OOM, SIGKILL, 6h job limit), a timestamp-encoded sentinel file is left inside the lock directory (`concurrency_lock_path`), so only that lock''s own sentinel decides takeover; the holder renames its sentinel to a fresh timestamp before every mirror attempt (one attempt is capped at 5 hours), so "stale" means that no attempt has started for 6 hours: the next runner treats the sentinel as stale only once it is older than 6 hours and then takes over, on self-hosted runners with jobs longer than 6 hours too; a failed rename only prints a warning; a younger sentinel belongs to a run that may still be mirroring, so the waiter fails after `concurrency_lock_timeout` with an error naming the sentinel. A lock directory without a sentinel may belong to a run that has not uploaded it yet, so it is taken over only after the waiter has seen it without a sentinel for 120 seconds. See README "Concurrency / deployment lock" for details.'
    required: false
    default: 'false'
  concurrency_lock_path:
    description: 'Path of the sentinel directory used by `concurrency_lock`. Relative paths are resolved against the FTP user''s home; absolute paths are accepted. Must be a valid FTP path: validated by `validate_path` (lib.sh), which rejects `..` path-traversal components, a leading `-` (would be misread as an lftp option), embedded newlines and other `[[:cntrl:]]` control characters, the shell metacharacters `;`, `|`, `&` and the backtick character, `$` (shell substitution), `!` (lftp shell escape), `"` (breaks lftp -e string parsing), ASCII space (breaks lftp -e token parsing), unbalanced IPv6 brackets, empty `[]` brackets, and (because the path is pasted unquoted into the lock commands) `>`, `\` and `''` (lftp output redirection, escape and quote characters). Default: ".lftp-deployment.lock" (a hidden directory alongside the deployed files). The directory will be created and removed by the action, and each run writes its sentinel file inside it, so different paths are independent locks; do not use a path that holds user data.'
    required: false
    default: '.lftp-deployment.lock'
  concurrency_lock_timeout:
    description: 'Maximum seconds to wait for the lock when `concurrency_lock` is "true" and another run is currently holding it. After this, the action exits 1 with a clear error. Set to "0" to fail immediately when the lock is held (no waiting), and also when the lock directory was created but the sentinel file could not be uploaded into it; with a positive value such an upload failure is retried every `concurrency_lock_poll_interval` seconds, and if the last attempt failed that way the error says so (check write permission and quota under `concurrency_lock_path`) instead of reporting a held lock. The wait is measured as wall-clock time and checked before each attempt, so an attempt that is already running can finish after the limit (a few seconds on a healthy server, up to about a minute on a stuck one, plus one poll interval). It does not limit how long the holder may keep the lock. Must be a non-negative integer without leading zeros. Default is 300 (5 minutes).'
    required: false
    default: '300'
  concurrency_lock_poll_interval:
    description: 'Seconds between lock acquisition attempts when `concurrency_lock` is "true". Must be an integer greater than 0 without leading zeros: "0" (and any other non-numeric or zero-prefixed value) is rejected with exit 2 to prevent a loop without a pause; an empty value falls back to the default 5. The number of attempts is not fixed: the wait is limited by the wall-clock `concurrency_lock_timeout`, and each attempt also spends time on its own server round-trips, so fewer than timeout divided by interval attempts fit. Lower values reduce the time-to-acquire after the holder releases; higher values reduce the number of MKD round-trips against the server.'
    required: false
    default: '5'
runs:
  using: 'docker'
  image: 'Dockerfile'
branding:
  color: 'purple'
  icon: 'send'
