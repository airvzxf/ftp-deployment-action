name: 'FTP Deployment'
author: 'Israel Roldan <israel.alberto.rv@gmail.com>'
description: >-
  Copy all the files and folders via FTP from your Git project to your server in a specific path,
  optionally deleting remote files that no longer exist locally.
inputs:
  server:
    description: 'FTP Server.'
    required: true
  user:
    description: 'FTP User.'
    required: true
  password:
    description: 'FTP Password.'
    required: true
  local_dir:
    description: 'Local directory.'
    required: false
    default: './'
  remote_dir:
    description: 'Remote directory.'
    required: false
    default: './'
  delete:
    description: 'If "true", delete remote files that do not exist in local_dir (files matching `exclude` are kept).'
    required: false
    default: 'false'
  max_retries:
    description: 'Number of times the lftp command will be executed on error. `0` means retry forever (the only exits are lftp success or the global 5h timeout). `1` means no retries.'
    required: false
    default: '10'
  no_symlinks:
    description: 'Do not create symbolic links.'
    required: false
    default: 'true'
  mirror_verbose:
    description: 'Mirror verbosity level (0-3). Passed as --verbose=N to lftp mirror.'
    required: false
    default: '1'
  ftp_ssl_allow:
    description: 'FTP - Allow SSL encryption.'
    required: false
    default: 'true'
  ssl_verify_certificate:
    description: 'Verify SSL certificate.'
    required: false
    default: 'true'
  ssl_check_hostname:
    description: 'Check certificate hostname.'
    required: false
    default: 'true'
  ftp_passive_mode:
    description: 'FTP - This can be useful if you are behind a firewall or a dumb masquerading router.'
    required: false
    default: 'true'
  ftp_use_feat:
    description: 'FTP - FEAT: Determining what extended features the FTP server supports.'
    required: false
    default: 'false'
  ftp_nop_interval:
    description: 'FTP - Delay in seconds between NOOP commands when downloading tail of a file.'
    required: false
    default: '2'
  net_max_retries:
    description: 'NET - Maximum number of attempts per lftp operation; 1 means no retries, 0 means unlimited (not recommended).'
    required: false
    default: '1'
  net_persist_retries:
    description: 'NET - Number of times lftp retries hard (5xx) errors such as "530 Login incorrect" before giving up; 0 reports them immediately.'
    required: false
    default: '0'
  net_timeout:
    description: 'NET - Sets the network protocol timeout.'
    required: false
    default: '15s'
  dns_max_retries:
    description: 'DNS - 0 no limit trying to lookup an address otherwise try only this number of times.'
    required: false
    default: '8'
  dns_fatal_timeout:
    description: 'DNS - Time for DNS queries. Set to "never" to disable.'
    required: false
    default: '10s'
  lftp_settings:
    description: 'Additional raw lftp settings, e.g. "set cache:cache-empty-listings true; set cmd:status-interval 1s;". Appended to the lftp `-e` command; rejected if it contains control characters, backtick, `$`, `!`, more than 3 `;`-chained directives, or a newline.'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated shell globs (e.g. `*.map, *.bak, node_modules/`). Matching files are neither uploaded nor deleted. Items must not contain spaces or start with `-`.'
    required: false
    default: ''
  debug:
    description: 'If "true", print resolved input values to the log. Default is "false" (only show which inputs were received, not their values).'
    required: false
    default: 'false'
  dry_run:
    description: 'If "true", perform a dry run: lftp will compute the mirror plan but not transfer or delete any file. Useful to preview what the action would change before a destructive run. It still connects and logs in, so an unreachable server or a wrong password fails the dry run. The action exits 0 on success (i.e. on a clean dry-run plan) and 1 on a hard error.'
    required: false
    default: 'false'
  concurrency_lock:
    description: 'If "true", serialize concurrent deployments to the same FTP server by acquiring a server-side sentinel directory before the mirror. Implementation: lftp issues the high-level `mkdir <path>` before the mirror and `quote RMD <path>` after; while mkdir returns 550 (lock held), the action polls up to `concurrency_lock_timeout` seconds. Uses RFC 959 MKD/RMD which every FTP server supports. The lock is released on any exit path (success, error, SIGINT, 5h timeout) by the cleanup trap. Default is "false" (no cross-runner serialization). For zero-config serialization, prefer the GitHub Actions `concurrency:` block in your workflow. Stale-lock auto-recovery: if the previous holder died before RMD (runner OOM, SIGKILL, 6h job limit), a timestamp-encoded sentinel file is left at the FTP root; the next runner treats it as stale only once it is older than 6 hours (GitHub''s maximum job time) and then takes over; a younger sentinel belongs to a run that may still be mirroring, so the waiter fails after `concurrency_lock_timeout` with an error naming the sentinel. See README "Concurrency / deployment lock" for details.'
    required: false
    default: 'false'
  concurrency_lock_path:
    description: 'Path of the sentinel directory used by `concurrency_lock`. Relative paths are resolved against the FTP user''s home; absolute paths are accepted. Must be a valid FTP path: validated by `validate_path` (lib.sh), which rejects `..` path-traversal components, a leading `-` (would be misread as an lftp option), embedded newlines and other `[[:cntrl:]]` control characters, `;|&`` shell metacharacters, `$` (shell substitution), `!` (lftp shell escape), `"` (breaks lftp -e string parsing), ASCII space (breaks lftp -e token parsing), unbalanced IPv6 brackets, and empty `[]` brackets. Default: ".lftp-deployment.lock" (a hidden directory alongside the deployed files). The directory will be created and removed by the action; do not use a path that holds user data.'
    required: false
    default: '.lftp-deployment.lock'
  concurrency_lock_timeout:
    description: 'Maximum seconds to wait for the lock when `concurrency_lock` is "true" and another run is currently holding it. After this, the action exits 1 with a clear error. Set to "0" to fail immediately when the lock is held (no waiting). It does not limit how long the holder may keep the lock. Default is 300 (5 minutes).'
    required: false
    default: '300'
  concurrency_lock_poll_interval:
    description: 'Seconds between lock acquisition attempts when `concurrency_lock` is "true". Must be > 0 (validated by lib.sh::validate_int — a 0 or empty value is rejected with exit 2 to prevent an infinite MKD loop). Default is 5, which gives 60 attempts over the default 300-second timeout. Lower values reduce the time-to-acquire after the holder releases; higher values reduce the number of MKD round-trips against the server.'
    required: false
    default: '5'
runs:
  using: 'docker'
  image: 'Dockerfile'
branding:
  color: 'purple'
  icon: 'send'
