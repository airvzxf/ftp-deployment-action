---
# Dependabot config for ftp-deployment-action.
#
# Two ecosystems: docker (the Alpine base image of the three
# Dockerfiles) and github-actions (the actions referenced from
# .github/workflows/*.yml).
#
# Notes:
# * No ecosystem below updates these; they are bumped by hand:
#   - `lftp~4.9.3`: the docker ecosystem updates `FROM` images only,
#     not `apk add` packages (see the "Stack" section in AGENTS.md).
#     The lftp / ca-certificates ignore rules below are kept as a
#     guard in case that changes.
#   - the fauria/vsftpd digest: the e2e.yml service image plus the
#     FTP_SERVER_IMAGE defaults in tests/integration/lib/common.sh and
#     tests/integration/run-integration-tests.sh, kept equal by
#     tests/acceptance/static.sh S19. Upstream has not published
#     since 2023-01.
#   - actionlint: the `ver=` line in .github/workflows/ci.yml, and
#     the `sha=` line next to it (the tarball's SHA-256 from the
#     upstream actionlint_<ver>_checksums.txt).
#   - the `# syntax=docker/dockerfile:1.4` frontends of
#     tests/Dockerfile.smoke and tests/integration/Dockerfile.test-server
#     (the docker ecosystem documents `FROM` lines only; whether it
#     also bumps `# syntax=` is unverified, so treat them as manual).
# * `alpine` is pinned as tag@digest (`alpine:X.Y.Z@sha256:...`) in
#   Dockerfile and in the two test images
#   (tests/integration/Dockerfile.test-server, tests/Dockerfile.smoke).
#   Dependabot updates both the tag and the digest, so a PR shows the
#   Alpine version it moves to. A bare digest had no version to
#   compare, and a 3.23 -> 3.24 jump arrived as a digest refresh (#55).
#   All three directories are listed so the dockerfile-base group
#   still bumps them in ONE PR: #332 bumped only Dockerfile, and the
#   test images drifted to an older OpenSSL.
#   tests/acceptance/static.sh S13 fails if the tags or digests differ.
# * For github-actions every update type is proposed: no group sets
#   `update-types` and there is no `ignore`, so a major bump can arrive
#   in the same PR as minor/patch bumps of the same group. Grouping
#   only splits PRs by action family (see the groups below); it does
#   not hold majors back. Review every Dependabot PR; majors of
#   `actions/checkout`, `actions/attest`, etc. deserve extra care
#   because they often require runner version bumps.
# * Nothing here auto-merges. No workflow in .github/workflows enables
#   auto-merge for Dependabot PRs; the maintainer merges each one.

version: 2
updates:
  - package-ecosystem: "docker"
    directories: ["/", "/tests", "/tests/integration"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Defensive; matches nothing today. These two rules name apk
      # packages (`lftp~4.9.3`, `ca-certificates`), which the docker
      # ecosystem does not see (it updates `FROM` images only), so
      # they filter no PR. If Dependabot ever did report them, they
      # would suppress major and minor bumps of lftp (those have
      # historically changed mirror semantics) and major bumps of
      # ca-certificates. Nothing is auto-merged either way.
      - dependency-name: "lftp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ca-certificates"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per Alpine tag@digest bump, covering the three Dockerfiles.
      # The exclude-patterns are defensive and match nothing today (same
      # reason as the ignore rules above: apk packages are not seen).
      dockerfile-base:
        patterns: ["*"]
        exclude-patterns: ["lftp", "ca-certificates"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One group (so one PR per run) per action family, not per major:
      # no group sets `update-types`, so majors, minors and patches of
      # a family share its PR. Families: actions/checkout, docker/*,
      # actions/attest, sigstore/cosign-installer, and actions-others
      # (every other action, in a single PR). This keeps the surface
      # of any single review manageable and the git log clean.
      actions-checkout:
        patterns: ["actions/checkout"]
      actions-docker:
        patterns: ["docker/*"]
      actions-attest:
        patterns: ["actions/attest"]
      # sigstore/cosign-installer has its own group so its bumps never
      # ride along with unrelated actions. History: the upstream does
      # not publish a floating `@v4` git ref, and a Dependabot bump of
      # the old tag-ref pin to `@v4` (#62) broke release v2.4.0 at job
      # setup (CHANGELOG 2.4.1). release.yml now pins it by commit SHA
      # (`@<sha> # v4.1.2`), as it does every action, and Dependabot
      # moves SHA pins to a new SHA, so that failure mode no longer
      # applies. The group does not restrict versions, only splits the
      # PR, so each bump is still a separate review (and must be a
      # real release that resolves).
      actions-cosign-installer:
        patterns: ["sigstore/cosign-installer"]
      actions-others:
        patterns: ["*"]
        exclude-patterns: ["actions/checkout", "docker/*", "actions/attest", "sigstore/cosign-installer"]
