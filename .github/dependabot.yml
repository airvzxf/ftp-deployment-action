---
# Dependabot config for ftp-deployment-action.
#
# Two ecosystems: docker (the Alpine base image of the three
# Dockerfiles) and github-actions (the actions referenced from
# .github/workflows/*.yml).
#
# Notes:
# * No ecosystem below updates these; they are bumped by hand:
#   - `lftp~4.9.3`: the docker ecosystem updates `FROM` images only,
#     not `apk add` packages (see the "Stack" section in AGENTS.md).
#     The lftp / ca-certificates ignore rules below are kept as a
#     guard in case that changes.
#   - the fauria/vsftpd digest: the e2e.yml service image plus the
#     FTP_SERVER_IMAGE defaults in tests/integration/lib/common.sh and
#     tests/integration/run-integration-tests.sh, kept equal by
#     tests/acceptance/static.sh S19. Upstream has not published
#     since 2023-01.
#   - actionlint: the `ver=` line in .github/workflows/ci.yml.
#   - the `# syntax=docker/dockerfile:1.4` frontends of
#     tests/Dockerfile.smoke and tests/integration/Dockerfile.test-server
#     (the docker ecosystem documents `FROM` lines only; whether it
#     also bumps `# syntax=` is unverified, so treat them as manual).
# * `alpine` is pinned by digest in Dockerfile and in the two test
#   images (tests/integration/Dockerfile.test-server,
#   tests/Dockerfile.smoke). All three directories are listed so the
#   dockerfile-base group bumps them in ONE PR: #332 bumped only
#   Dockerfile, and the test images drifted to an older OpenSSL.
#   tests/acceptance/static.sh S13 fails if the digests differ.
# * For github-actions we take minor and patch; major bumps of
#   `actions/checkout`, `actions/attest`, etc. are reviewed
#   because they often require runner version bumps.

version: 2
updates:
  - package-ecosystem: "docker"
    directories: ["/", "/tests", "/tests/integration"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Only follow patch-level bumps of the lftp package; major and
      # minor bumps have historically changed mirror semantics.
      - dependency-name: "lftp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ca-certificates follows Mozilla's NSS bug-fix cadence;
      # patches are auto-merge, majors (a CA root change) are reviewed.
      - dependency-name: "ca-certificates"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per Alpine digest bump, covering the three Dockerfiles.
      dockerfile-base:
        patterns: ["*"]
        exclude-patterns: ["lftp", "ca-certificates"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One PR per action major. Keeps the surface of any single
      # review manageable and the git log clean.
      actions-checkout:
        patterns: ["actions/checkout"]
      actions-docker:
        patterns: ["docker/*"]
      actions-attest:
        patterns: ["actions/attest"]
      # sigstore/cosign-installer is pinned to a specific version
      # (v4.1.2) in release.yml because the upstream does not
      # publish a floating `@v4` git ref; dependabot's default
      # proposal of `@v4` would fail to resolve at job setup.
      # Keep the group on a single track so the next bump is a
      # conscious decision.
      actions-cosign-installer:
        patterns: ["sigstore/cosign-installer"]
      actions-others:
        patterns: ["*"]
        exclude-patterns: ["actions/checkout", "docker/*", "actions/attest", "sigstore/cosign-installer"]
