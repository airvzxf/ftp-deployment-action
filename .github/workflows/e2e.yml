name: E2E

# Runs the action exactly the way a user does: `uses: ./` with the
# required inputs (server, user, password) plus local_dir and remote_dir
# (the fixture to upload and the e2euser home on the server, instead of
# their './' defaults), so GitHub parses action.yml, builds the Dockerfile
# on the runner and injects the action.yml default of every other input.
# This is the only test that would have caught v2.11.14 (invalid
# action.yml, apk pins that no longer resolve, net_max_retries=0 hang).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uses-dot:
    name: E2E · uses ./ against vsftpd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      ftp:
        image: docker.io/fauria/vsftpd@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
        env:
          FTP_USER: e2euser
          FTP_PASS: e2epass
          PASV_ADDRESS: ftp
          PASV_ADDR_RESOLVE: 'YES'
          PASV_ENABLE: 'YES'
          PASV_MIN_PORT: '21100'
          PASV_MAX_PORT: '21110'
          REVERSE_LOOKUP_ENABLE: 'NO'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy with required inputs and target paths
        timeout-minutes: 2
        uses: ./
        with:
          server: ftp://ftp:21
          user: e2euser
          password: e2epass
          local_dir: tests/integration/fixtures/sample-public-html
          remote_dir: /

      - name: Assert the files landed on the server
        env:
          FTP_CID: ${{ job.services.ftp.id }}
        run: |
          set -eu
          docker exec "${FTP_CID}" ls -laR /home/vsftpd/e2euser
          # Compare every fixture file (nested ones and dotfiles such as
          # assets/.keep included) with the uploaded copy by SHA-256.
          # remote_dir is /, the e2euser home in the vsftpd container.
          fixture=tests/integration/fixtures/sample-public-html
          list="${RUNNER_TEMP}/e2e-fixture-files"
          find "${fixture}" -type f -print > "${list}"
          checked=0
          failed=0
          while IFS= read -r f; do
            rel=${f#"${fixture}/"}
            want=$(sha256sum < "${f}")
            want=${want%% *}
            if got=$(docker exec "${FTP_CID}" sha256sum "/home/vsftpd/e2euser/${rel}" 2>/dev/null); then
              got=${got%% *}
              if [ "${got}" != "${want}" ]; then
                echo "::error::${rel} differs on the FTP server (sha256 ${got}, expected ${want})"
                failed=$((failed + 1))
              fi
            else
              echo "::error::${rel} missing or unreadable on the FTP server"
              failed=$((failed + 1))
            fi
            checked=$((checked + 1))
          done < "${list}"
          if [ "${checked}" -eq 0 ]; then
            echo "::error::no fixture files found under ${fixture}"
            exit 1
          fi
          if [ "${failed}" -ne 0 ]; then
            echo "::error::${failed} of ${checked} files missing or different on the FTP server"
            exit 1
          fi
          echo "All ${checked} fixture files match on the FTP server."
