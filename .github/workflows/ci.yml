name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: |
          set -e
          shellcheck init.sh
          shellcheck tests/contract.sh
          shellcheck tests/smoke.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1
        with:
          ignore: SC2096

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3
        with:
          dockerfile: Dockerfile
          # DL3018 (pin apk versions) is a real concern but fixing it is
          # out of scope for this PR — it will be addressed alongside
          # the image digest pinning work. Treat as info for now.
          failure-threshold: error

  contract:
    name: Contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify action.yml ↔ init.sh consistency
        run: tests/contract.sh

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run init.sh smoke tests in alpine
        run: tests/smoke.sh
