name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: |
          set -e
          # -x: follow `shellcheck source=` directives (entrypoint.sh sources lib.sh,
          # tests/integration/scenarios/*.sh source tests/integration/lib/common.sh).
          shellcheck -x entrypoint.sh lib.sh
          shellcheck tests/contract.sh
          shellcheck tests/smoke.sh
          shellcheck -x tests/integration/lib/common.sh tests/integration/run-integration-tests.sh
          shellcheck -x tests/integration/scenarios/*.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rhysd/actionlint is a Go binary, not a JavaScript action. We install
      # it directly from the upstream release instead of using a wrapper
      # action, which keeps the dependency footprint small and the version
      # pin explicit.
      - name: Install actionlint
        run: |
          set -e
          ver=1.7.7
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Run actionlint
        run: actionlint -color

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin to a specific tag because the upstream has no floating "v3" ref
      # (only v3.0.0, v3.1.0, ...). Using `@v3` makes the resolver fail.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3018 (pin apk versions) is a real concern but fixing it is
          # out of scope for this PR — it will be addressed alongside
          # the image digest pinning work. Treat as info for now.
          failure-threshold: error

  contract:
    name: Contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify action.yml ↔ entrypoint.sh/lib.sh consistency
        run: tests/contract.sh

  unit:
    name: Unit tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version
      - name: Run bats unit tests for lib.sh
        run: bats tests/unit

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run entrypoint.sh smoke tests in alpine
        run: tests/smoke.sh

  # Integration tests (issue #117): boot a real vsftpd container
  # (docker.io/fauria/vsftpd) and exercise the action against it.
  # Three scenarios actually run today (01, 02, 05); scenarios 03
  # and 04 are stubs deferred to #120 (FTPS integration). The
  # timeout-minutes: 5 reflects the budget defined in #117's
  # acceptance criteria; previously this section had no explicit
  # timeout (default 360 min), which let regressions hide behind
  # GH Actions' default budget. Pinning it to 5 minutes forces the
  # harness to stay fast.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the action image under test
        run: make build IMAGE=ftp-deployment-action:ci-integration VERSION=ci
      - name: Run integration scenarios against a real vsftpd
        run: make integration IMAGE=ftp-deployment-action:ci-integration
