name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: |
          set -e
          # -x: follow `shellcheck source=` directives (entrypoint.sh sources lib.sh,
          # tests/integration/scenarios/*.sh source tests/integration/lib/common.sh).
          shellcheck -x entrypoint.sh lib.sh
          shellcheck tests/contract.sh
          shellcheck tests/smoke.sh
          shellcheck -x tests/integration/lib/common.sh tests/integration/run-integration-tests.sh
          shellcheck -x tests/integration/scenarios/*.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rhysd/actionlint is a Go binary, not a JavaScript action. We install
      # it directly from the upstream release instead of using a wrapper
      # action, which keeps the dependency footprint small and the version
      # pin explicit.
      - name: Install actionlint
        run: |
          set -e
          ver=1.7.7
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Run actionlint
        run: actionlint -color

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin to a specific tag because the upstream has no floating "v3" ref
      # (only v3.0.0, v3.1.0, ...). Using `@v3` makes the resolver fail.
      # hadolint/hadolint-action takes a single `dockerfile:` input
      # (no array support), so each Dockerfile gets its own step. Both
      # steps fail with `error`-threshold rules; the integration job
      # only kicks off once both succeed.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: tests/integration/Dockerfile.test-server
          # DL3018 (pin apk versions) is a real concern but fixing it is
          # out of scope for this PR — it will be addressed alongside
          # the image digest pinning work. Treat as info for now.
          failure-threshold: error

  contract:
    name: Contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify action.yml ↔ entrypoint.sh/lib.sh consistency
        run: tests/contract.sh

  unit:
    name: Unit tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version
      - name: Run bats unit tests for lib.sh
        run: bats tests/unit

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v2.11.3 (#137): build the pre-baked smoke-test image
      # (tests/Dockerfile.smoke) once, then run the suite against
      # it. The previous inline `apk add --no-cache lftp ca-certificates`
      # inside every container raced the apk index download and
      # silently masked apk failures behind `>/dev/null 2>&1`. The
      # pre-baked image is pinned to the same alpine digest + lftp
      # version as the production image, so the smoke suite
      # exercises the same runtime the user gets.
      - name: Build the smoke-test image
        run: make build-smoke-image SMOKE_IMAGE=ftp-deployment-action-smoke:ci-integration
      - name: Run entrypoint.sh smoke tests
        run: tests/smoke.sh

  # Integration tests (issue #117): boot a real vsftpd container
  # (docker.io/fauria/vsftpd) and exercise the action against it.
  # Scenarios 01/02/05 use fauria/vsftpd (plain FTP). Scenarios 03/04
  # (FTPS explicit / implicit, added by #120 / PR #130) use a
  # pre-baked vsftpd+openssl alpine image built from
  # tests/integration/Dockerfile.test-server (closes #135): the
  # previous inline-`apk add` shape raced the apk index download
  # against the 20s wait_for_port deadline in CI. Building the
  # FTPS test server image in this job (rather than per-scenario)
  # eliminates that race.
  # The timeout-minutes: 5 reflects the budget defined in #117's
  # acceptance criteria; previously this section had no explicit
  # timeout (default 360 min), which let regressions hide behind
  # GH Actions' default budget. Pinning it to 5 minutes forces the
  # harness to stay fast.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the action image under test
        run: make build IMAGE=ftp-deployment-action:ci-integration VERSION=ci
      # Build the pre-baked FTPS test server image used by scenarios
      # 03 / 04 (closes #135). Same `ci-integration` suffix as the
      # action image so both rebuild together on the same CI run;
      # the Dockerfile.test-server is small (alpine base + 2 packages)
      # and the build completes in <10s on the CI runner.
      - name: Build the FTPS test server image
        run: make build-test-server-image TEST_SERVER_IMAGE=ftp-deployment-action-test-server:ci-integration
      - name: Run integration scenarios against a real vsftpd
        run: make integration IMAGE=ftp-deployment-action:ci-integration TEST_SERVER_IMAGE=ftp-deployment-action-test-server:ci-integration
